version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
      time: "06:00"
  # The development add-on pins two base images of its own - the source
  # stage and the Node stage that builds the dashboard.
  - package-ecosystem: "docker"
    directory: "/batcontrol-development"
    schedule:
      interval: weekly
      time: "06:00"
  # The stable add-on's base image is the BUILD_FROM default in its Dockerfile.
  - package-ecosystem: "docker"
    directory: "/batcontrol"
    schedule:
      interval: weekly
      time: "06:00"
